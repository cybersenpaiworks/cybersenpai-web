services:
  cybersenpai-web:
    image: cybersenpai-web:latest
    container_name: cybersenpai-web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL:-https://home.example.com}
        COMMIT_HASH: ${COMMIT_HASH:-portainer-git}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      SITE_URL: ${SITE_URL:-https://home.example.com}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://home.example.com}
      NEXT_PUBLIC_COMMIT_HASH: ${COMMIT_HASH:-portainer-git}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/icon.svg >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy-network:
    external: true
    name: ${PROXY_NETWORK:-proxy-network}
